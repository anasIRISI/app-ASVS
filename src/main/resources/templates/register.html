<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Application ASVS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Inscription</h1>
            
            <!-- Messages d'erreur -->
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/register}" 
                  th:object="${registerRequest}" 
                  method="post">
                
                <div class="form-group">
                    <label for="fullName">Nom complet *</label>
                    <input type="text" 
                           id="fullName" 
                           th:field="*{fullName}" 
                           required 
                           minlength="2"
                           maxlength="100"
                           autocomplete="name"
                           placeholder="Jean Dupont">
                    <span th:if="${#fields.hasErrors('fullName')}" 
                          th:errors="*{fullName}" 
                          class="error-text"></span>
                </div>
                
                <div class="form-group">
                    <label for="email">Adresse email *</label>
                    <input type="email" 
                           id="email" 
                           th:field="*{email}" 
                           required 
                           autocomplete="email"
                           placeholder="jean.dupont@example.com">
                    <span th:if="${#fields.hasErrors('email')}" 
                          th:errors="*{email}" 
                          class="error-text"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe *</label>
                    <input type="password" 
                           id="password" 
                           th:field="*{password}" 
                           required 
                           minlength="8"
                           maxlength="128"
                           autocomplete="new-password"
                           placeholder="Minimum 8 caractères">
                    <span th:if="${#fields.hasErrors('password')}" 
                          th:errors="*{password}" 
                          class="error-text"></span>
                    <small class="help-text">
                        Le mot de passe doit contenir au moins 8 caractères et ne doit pas être un mot de passe courant.
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe *</label>
                    <input type="password" 
                           id="confirmPassword" 
                           th:field="*{confirmPassword}" 
                           required 
                           minlength="8"
                           maxlength="128"
                           autocomplete="new-password"
                           placeholder="Répétez votre mot de passe">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" 
                          th:errors="*{confirmPassword}" 
                          class="error-text"></span>
                </div>
                
                <!-- Protection CSRF automatique -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <button type="submit" class="btn btn-primary">S'inscrire</button>
            </form>
            
            <div class="auth-links">
                <p>Déjà un compte ? <a th:href="@{/login}">Se connecter</a></p>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le mot de passe - Application ASVS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Changer le mot de passe</h1>
            
            <!-- Messages d'erreur -->
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/change-password}" 
                  th:object="${changePasswordRequest}" 
                  method="post">
                
                <div class="form-group">
                    <label for="currentPassword">Mot de passe actuel *</label>
                    <input type="password" 
                           id="currentPassword" 
                           th:field="*{currentPassword}" 
                           required 
                           autocomplete="current-password"
                           placeholder="Votre mot de passe actuel">
                    <span th:if="${#fields.hasErrors('currentPassword')}" 
                          th:errors="*{currentPassword}" 
                          class="error-text"></span>
                </div>
                
                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe *</label>
                    <input type="password" 
                           id="newPassword" 
                           th:field="*{newPassword}" 
                           required 
                           minlength="8"
                           maxlength="128"
                           autocomplete="new-password"
                           placeholder="Minimum 8 caractères">
                    <span th:if="${#fields.hasErrors('newPassword')}" 
                          th:errors="*{newPassword}" 
                          class="error-text"></span>
                    <small class="help-text">
                        Le nouveau mot de passe doit contenir au moins 8 caractères et ne doit pas être un mot de passe courant.
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="confirmNewPassword">Confirmer le nouveau mot de passe *</label>
                    <input type="password" 
                           id="confirmNewPassword" 
                           th:field="*{confirmNewPassword}" 
                           required 
                           minlength="8"
                           maxlength="128"
                           autocomplete="new-password"
                           placeholder="Répétez le nouveau mot de passe">
                    <span th:if="${#fields.hasErrors('confirmNewPassword')}" 
                          th:errors="*{confirmNewPassword}" 
                          class="error-text"></span>
                </div>
                
                <!-- Protection CSRF automatique -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Changer le mot de passe</button>
                    <a th:href="@{/profile}" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
